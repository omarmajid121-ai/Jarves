<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="مساعد">
<meta name="theme-color" content="#02040a">
<title>مساعد</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
<style>
:root{
  --void:#02040a; --panel:rgba(12,20,34,.78); --edge:rgba(160,215,255,.22); --ink:#eaf4ff; --soft:#9fb6cf; --ice:#6fd6ff; --rose:#ff7d8c;
  --font:-apple-system,"SF Arabic","SF Pro Text","IBM Plex Sans Arabic","Segoe UI",Tahoma,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--void);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased;overflow:hidden;
  -webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;overscroll-behavior:none}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--ice);outline-offset:2px}
#stage{position:fixed;inset:0;border:0;padding:0;margin:0;background:transparent;width:100%;height:100%;display:block}
#hud{position:absolute;inset:0;width:100%;height:100%;display:block}
.readout{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom) + 64px);display:flex;flex-direction:column;align-items:center;gap:8px;padding:0 24px;pointer-events:none}
#state{font-size:15px;font-weight:600;letter-spacing:0;color:var(--ice);min-height:20px;text-align:center}
#caption{font-size:17px;color:var(--ink);text-align:center;max-width:460px;min-height:54px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;opacity:.92}
/* iOS sheet */
:root{--blue:#0A84FF;--red:#FF453A;--label:#FFFFFF;--label2:rgba(235,235,245,.62);--label3:rgba(235,235,245,.32);--sep:rgba(84,84,88,.65);--fill:rgba(118,118,128,.24);--cell:rgba(118,118,128,.18)}
#card{position:fixed;left:0;right:0;bottom:0;margin:0 auto;max-width:540px;height:86%;z-index:10;display:flex;flex-direction:column;
  background:rgba(28,28,30,.72);border:.5px solid rgba(255,255,255,.14);border-bottom:0;border-radius:38px 38px 0 0;
  -webkit-backdrop-filter:blur(40px) saturate(180%);backdrop-filter:blur(40px) saturate(180%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.18),0 -20px 60px rgba(0,0,0,.6);
  transform:translateY(calc(100% - 44px - env(safe-area-inset-bottom)));transition:transform .45s cubic-bezier(.32,.72,0,1)}
#card.open{transform:translateY(0)}
#card.drag{transition:none}
#grip{flex:none;height:44px;border:0;background:transparent;display:flex;align-items:flex-start;justify-content:center;width:100%;padding:6px 0 0;touch-action:none}
#grip i{display:block;width:36px;height:5px;border-radius:3px;background:var(--label3)}
.cardbody{flex:1;min-height:0;display:flex;flex-direction:column;gap:14px;padding:0 16px calc(env(safe-area-inset-bottom) + 12px);-webkit-user-select:text;user-select:text}
.head{display:flex;flex-direction:column;gap:0;padding:0 4px}
.head h1{margin:0;font-size:34px;line-height:41px;font-weight:700;letter-spacing:0}
.head small{color:var(--label2);font-size:15px;line-height:20px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:0;padding:2px;border-radius:9px;background:var(--fill)}
.seg button{min-height:32px;border:0;border-radius:7px;background:transparent;color:var(--label);font-weight:500;font-size:13px}
.seg button[aria-selected="true"]{background:#636366;font-weight:600;box-shadow:0 3px 8px rgba(0,0,0,.12),0 3px 1px rgba(0,0,0,.04)}
.pane{flex:1;min-height:0;display:none;flex-direction:column;gap:12px}
.pane.on{display:flex}
.msgs{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;display:flex;flex-direction:column;gap:6px;padding:2px 0}
.msg{max-width:78%;padding:8px 14px;border-radius:19px;white-space:pre-wrap;overflow-wrap:anywhere;font-size:17px;line-height:22px}
.msg.me{align-self:flex-end;background:var(--blue);color:#fff;border-end-end-radius:5px}
.msg.ai{align-self:flex-start;background:#26252A;color:#fff;border-end-start-radius:5px}
.msg.note{align-self:center;max-width:100%;font-size:13px;line-height:18px;color:var(--label2);padding:6px 8px;text-align:center}
.empty{color:var(--label2);font-size:15px;text-align:center;margin:auto 0}
.bar{display:flex;align-items:center;gap:8px}
.bar .fieldwrap{flex:1;min-width:0;display:flex;align-items:center;gap:4px;min-height:40px;padding:0 4px 0 14px;border-radius:20px;border:.5px solid var(--sep);background:rgba(0,0,0,.25)}
[dir="rtl"] .bar .fieldwrap{padding:0 14px 0 4px}
.bar input{flex:1;min-width:0;height:38px;border:0;background:transparent;outline:none;font-size:17px}
.bar input::placeholder{color:var(--label3)}
.round{width:32px;height:32px;border-radius:50%;border:0;display:grid;place-items:center;padding:0;flex:none;position:relative}
.round::after{content:"";position:absolute;inset:-6px}
.send{background:var(--blue);color:#fff}
.endbtn{width:40px;height:40px;background:var(--red);color:#fff}
.settings{overflow-y:auto;-webkit-overflow-scrolling:touch;gap:0}
.ghdr{font-size:13px;line-height:18px;color:var(--label2);padding:0 16px 7px;margin:0}
.gftr{font-size:13px;line-height:18px;color:var(--label2);padding:7px 16px 0;margin:0 0 22px}
.group{background:var(--cell);border-radius:26px;overflow:hidden;flex:none}
.group + .ghdr{margin-top:22px}
.cell{display:flex;align-items:center;gap:12px;min-height:52px;padding:0 16px;position:relative;color:var(--label);text-decoration:none;font-size:17px;background:transparent;border:0;width:100%;text-align:start}
.cell + .cell::before{content:"";position:absolute;top:0;inset-inline-start:58px;inset-inline-end:0;border-top:.5px solid var(--sep)}
.cell.plain + .cell.plain::before,.cell.plain::before{inset-inline-start:16px}
.ic{width:30px;height:30px;border-radius:7px;display:grid;place-items:center;color:#fff;flex:none}
.ic.orange{background:#FF9F0A}.ic.blue{background:var(--blue)}.ic.pink{background:#FF375F}.ic.green{background:#30D158}
.cell label{flex:none}
.cell input,.cell select{flex:1;min-width:0;height:50px;border:0;background:transparent;outline:none;font-size:17px;color:var(--label2);text-align:end;-webkit-appearance:none;appearance:none}
.cell input::placeholder{color:var(--label3)}
#keyIn{direction:ltr;text-align:left}
.chev{color:var(--label3);flex:none}
.cell.link{color:var(--blue)}
.cell.danger{color:var(--red);justify-content:center}
.primary{min-height:50px;border-radius:25px;border:0;background:var(--blue);color:#fff;font-weight:600;font-size:17px;flex:none;margin:22px 0 14px}
/* action panel */
#act{position:fixed;left:16px;right:16px;margin:0 auto;max-width:380px;bottom:calc(env(safe-area-inset-bottom) + 60px);z-index:5;border-radius:28px;padding:16px;display:flex;flex-direction:column;gap:12px;
  background:rgba(28,28,30,.6);border:.5px solid rgba(255,255,255,.16);-webkit-backdrop-filter:blur(36px) saturate(180%);backdrop-filter:blur(36px) saturate(180%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.2),0 18px 50px rgba(0,0,0,.55);opacity:0;transform:translateY(26px) scale(.94);pointer-events:none;transition:opacity .35s ease,transform .5s cubic-bezier(.32,.72,0,1)}
#act.on{opacity:1;transform:none;pointer-events:auto}
body.acting .readout{opacity:0}
.readout{transition:opacity .25s ease}
.arow{display:flex;align-items:center;gap:12px}
.arow .tt{flex:1;min-width:0;display:flex;flex-direction:column}
#actTitle{font-size:17px;line-height:22px;font-weight:600;overflow-wrap:anywhere}
#actTag{font-size:13px;line-height:18px;color:var(--label2)}
#actBody{font-size:15px;line-height:21px;color:var(--label2);white-space:pre-wrap;overflow-wrap:anywhere;min-height:21px;margin:0}
.skel{display:flex;flex-direction:column;gap:8px}
.skel i{display:block;height:12px;border-radius:6px;background:linear-gradient(90deg,rgba(255,255,255,.08),rgba(255,255,255,.26),rgba(255,255,255,.08));background-size:200% 100%;animation:shim 1.4s linear infinite}
.skel i:nth-child(2){width:78%}.skel i:nth-child(3){width:56%}
@keyframes shim{from{background-position:200% 0}to{background-position:-200% 0}}
.abtns{display:flex;gap:10px}
.abtns a,.abtns button{flex:1;min-height:44px;border-radius:22px;border:0;display:grid;place-items:center;font-size:17px;font-weight:600;text-decoration:none}
#actGo{background:var(--blue);color:#fff}
#actClose{background:var(--fill);color:var(--label)}
.ic.violet{background:#BF5AF2}.ic.teal{background:#40C8E0}
@media (prefers-reduced-motion:reduce){#card,#act{transition:none}.skel i{animation:none}}
</style>
</head>
<body>
<button id="stage" aria-label="مساعد: اضغط للبدء أو للمقاطعة"><canvas id="hud" aria-hidden="true"></canvas></button>
<div class="readout" aria-live="polite"><div id="state">اضغط للبدء</div><div id="caption"></div></div>

<div id="act" role="status" aria-live="polite">
  <div class="arow"><span class="ic" id="actIc"></span><div class="tt"><div id="actTitle"></div><div id="actTag"></div></div></div>
  <p id="actBody"></p>
  <div class="skel" id="actSkel" hidden><i></i><i></i><i></i></div>
  <div class="abtns"><a id="actGo" href="#" hidden></a><button id="actClose">إغلاق</button></div>
</div>

<section id="card" aria-label="المحادثة والإعدادات">
  <button id="grip" aria-label="فتح البطاقة أو إغلاقها"><i></i><span id="gripText" hidden></span></button>
  <div class="cardbody">
    <div class="head"><h1>مساعد</h1><small id="conn">غير متصل</small></div>
    <div class="seg" role="tablist">
      <button role="tab" id="tabChat" aria-selected="true">المحادثة</button>
      <button role="tab" id="tabSet" aria-selected="false">الإعدادات</button>
    </div>
    <div class="pane on" id="paneChat">
      <div class="msgs" id="msgs"></div>
      <form class="bar" id="form">
        <div class="fieldwrap">
          <label for="q" style="position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)">اكتب رسالتك</label>
          <input id="q" type="text" autocomplete="off" enterkeyhint="send" placeholder="رسالة">
          <button class="round send" aria-label="إرسال"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20V5M5.5 11.5L12 5l6.5 6.5"></path></svg></button>
        </div>
        <button type="button" class="round endbtn" id="endBtn" aria-label="إنهاء المحادثة" hidden><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
      </form>
    </div>
    <div class="pane settings" id="paneSet">
      <p class="ghdr">مفتاح التفعيل</p>
      <div class="group">
        <div class="cell"><span class="ic orange"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="15" r="4"></circle><path d="M11 12l8-8M16 7l2.5 2.5M13.5 9.5l2 2"></path></svg></span>
          <label for="keyIn" style="position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)">مفتاح التفعيل</label>
          <input id="keyIn" type="password" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="AIza…"></div>
        <a class="cell link" href="https://aistudio.google.com/apikey" target="_blank" rel="noopener"><span class="ic green"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 14a4 4 0 005.7 0l3-3a4 4 0 00-5.7-5.7l-1 1M14 10a4 4 0 00-5.7 0l-3 3a4 4 0 005.7 5.7l1-1"></path></svg></span>
          <span style="flex:1">الحصول على مفتاح مجاني</span>
          <svg class="chev" aria-hidden="true" width="9" height="15" viewBox="0 0 9 15" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M7.5 1.5l-6 6 6 6"></path></svg></a>
      </div>
      <p class="gftr">أنشئ المفتاح من Google AI Studio ثم الصقه هنا. يُحفظ على هذا الجهاز فقط.</p>
      <p class="ghdr">التخصيص</p>
      <div class="group">
        <div class="cell"><span class="ic blue"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="8" r="4"></circle><path d="M4 20.5c0-4 3.6-6.5 8-6.5s8 2.5 8 6.5z"></path></svg></span>
          <label for="nameIn">الاسم</label><input id="nameIn" type="text" autocomplete="off" placeholder="اختياري"></div>
        <div class="cell"><span class="ic pink"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M4 10v4M8 6v12M12 3v18M16 7v10M20 10v4"></path></svg></span>
          <label for="voiceIn">الصوت</label>
          <select id="voiceIn">
            <optgroup label="عربي سعودي · صوت نسائي">
            <option value="Kore">Kore · واثق</option><option value="Aoede">Aoede · هادئ</option><option value="Leda">Leda · شبابي</option>
            <option value="Zephyr">Zephyr · مشرق</option><option value="Sulafat">Sulafat · دافئ</option><option value="Achernar">Achernar · ناعم</option>
            </optgroup>
            <optgroup label="English · British, formal">
            <option value="en:Charon">Charon · composed</option><option value="en:Algieba">Algieba · smooth</option><option value="en:Orus">Orus · firm</option>
            </optgroup>
          </select>
          <svg class="chev" aria-hidden="true" width="10" height="16" viewBox="0 0 10 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1.5 6L5 2.5 8.5 6M1.5 10L5 13.5 8.5 10"></path></svg></div>
      </div>
      <button class="primary" id="saveBtn">حفظ وبدء</button>
      <p class="ghdr">معاينة الحركات</p>
      <div class="group">
        <button class="cell plain" data-demo="call">اتصال</button>
        <button class="cell plain" data-demo="sms">رسالة نصية</button>
        <button class="cell plain" data-demo="email">البريد</button>
        <button class="cell plain" data-demo="meeting">اجتماع</button>
      </div>
      <p class="gftr">عرض تجريبي لما يظهر عند طلب اتصال أو رسالة أو بريد أو اجتماع.</p>
      <div class="group"><button class="cell plain danger" id="clearBtn">مسح سجل المحادثة</button></div>
    </div>
  </div>
</section>

<script>
(function(){
"use strict";
var $=function(s){return document.querySelector(s)};
var MODEL="gemini-3.1-flash-live-preview";
var WS="wss://generativelanguage.googleapis.com/ws/google.ai.generativelanguage.v1beta.GenerativeService.BidiGenerateContent?key=";
var K={key:"musaed.key",voice:"musaed.voice",name:"musaed.name",log:"musaed.log"};
function get(k){try{return localStorage.getItem(k)||""}catch(e){return ""}}

var ws=null,ctx=null,mic=null,src=null,proc=null,mute=null,wake=null,anIn=null,anOut=null,outBus=null;

var log=[],curMe=null,curAi=null;
try{log=JSON.parse(get(K.log)||"[]")||[]}catch(e){log=[]}

/* ================= HUD ================= */
var cv=$("#hud"),g=cv.getContext("2d"),W=0,H=0,DPR=1,still=window.matchMedia("(prefers-reduced-motion:reduce)").matches;
var PAL={idle:[[70,150,215],[36,84,150]],connect:[[196,188,255],[118,108,226]],listen:[[96,224,255],[44,150,255]],speak:[[255,196,96],[255,122,62]],
  call:[[112,240,164],[26,150,104]],sms:[[104,236,226],[24,140,170]],email:[[140,196,255],[58,104,232]],meeting:[[206,166,255],[118,84,232]]};
var act=null;
var c1=PAL.idle[0].slice(),c2=PAL.idle[1].slice(),amp=0,freq=new Uint8Array(64),bars=new Float32Array(72);
function fit(){DPR=Math.min(window.devicePixelRatio||1,2);W=cv.clientWidth;H=cv.clientHeight;cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR)}
window.addEventListener("resize",fit);fit();
function rgba(c,a){return "rgba("+(c[0]|0)+","+(c[1]|0)+","+(c[2]|0)+","+a+")"}
function arc(r,a0,a1,w,col){g.strokeStyle=col;g.lineWidth=w;g.beginPath();g.arc(0,0,r,a0,a1);g.stroke()}
function frame(now){
  var t=now/1000,P=act?PAL[act.type]:(PAL[mode]||PAL.idle),i;
  for(i=0;i<3;i++){c1[i]+=(P[0][i]-c1[i])*.07;c2[i]+=(P[1][i]-c2[i])*.07}
  /* audio level */
  var an=mode==="speak"?anOut:mode==="listen"?anIn:null,target=0;
  if(an){an.getByteFrequencyData(freq);var s=0;for(i=2;i<40;i++)s+=freq[i];target=Math.min(1,s/38/150)}
  else{for(i=0;i<64;i++)freq[i]=0;target=mode==="connect"?.25+.2*Math.sin(t*6):.06+.04*Math.sin(t*1.4)}
  amp+=(target-amp)*.22;
  if(live&&ready){var sp=speaking();if(sp&&mode!=="speak")setMode("speak");else if(!sp&&mode==="speak")setMode("listen")}
  if(live&&ctx&&ctx.state!=="running")$("#state").textContent="اضغط على الشاشة لتشغيل الصوت";

  g.setTransform(DPR,0,0,DPR,0,0);g.clearRect(0,0,W,H);
  var m=Math.min(W,H),R=m*.15,cx=W/2,cy=H*.42;
  /* field glow */
  var bg=g.createRadialGradient(cx,cy,R*.2,cx,cy,m*.95);
  bg.addColorStop(0,rgba(c2,.30+amp*.25));bg.addColorStop(.45,rgba(c2,.07));bg.addColorStop(1,"rgba(2,4,10,0)");
  g.fillStyle=bg;g.fillRect(0,0,W,H);
  g.save();g.translate(cx,cy);g.lineCap="round";

  /* outer orbit: thin ring, two travelling arcs, nodes */
  arc(R*2.86,0,6.2832,1,rgba(c1,.16));
  g.save();g.rotate(-t*.32);
  arc(R*2.86,0,.9,2.5,rgba(c1,.75));arc(R*2.86,3.1,3.75,2.5,rgba(c1,.55));
  for(i=0;i<3;i++){var na=i*2.094+1.4;g.fillStyle=rgba(c1,.9);g.beginPath();g.arc(Math.cos(na)*R*2.86,Math.sin(na)*R*2.86,3,0,7);g.fill()}
  g.restore();

  /* tick ring with three sweeps */
  g.save();g.rotate(-t*.11);g.lineCap="butt";
  for(i=0;i<120;i++){var ta=i/120*6.2832,big=i%10===0,r0=R*2.42,r1=r0+(big?R*.16:R*.07);
    g.strokeStyle=rgba(c1,big?.7:.3);g.lineWidth=big?2:1;g.beginPath();g.moveTo(Math.cos(ta)*r0,Math.sin(ta)*r0);g.lineTo(Math.cos(ta)*r1,Math.sin(ta)*r1);g.stroke()}
  g.restore();
  g.save();g.rotate(t*(.5+amp*1.4));g.lineCap="round";
  for(i=0;i<3;i++)arc(R*2.34,i*2.094,i*2.094+.55+amp*.5,3.5,rgba(c1,.9));
  g.restore();

  /* segmented ring */
  g.save();g.rotate(t*.22);g.lineCap="butt";
  for(i=0;i<36;i++){var sa=i/36*6.2832,lg=i%3===0;arc(R*1.98,sa,sa+(lg?.13:.07),lg?7:4,rgba(i%9===0?c1:c2,lg?.85:.5))}
  g.restore();

  /* voice spectrum: 72 radial bars, mirrored */
  g.lineCap="round";
  for(i=0;i<72;i++){var k=i<36?i:71-i,v=freq[2+Math.floor(k*.9)]/255;
    if(!an)v=.10+.07*Math.sin(t*2.2+k*.55)+(mode==="connect"?.18*Math.max(0,Math.sin(t*5-k*.3)):0);
    bars[i]+=(v-bars[i])*.35;var b=bars[i],ba=i/72*6.2832-1.5708,q0=R*1.22,q1=q0+R*(.05+b*.62);
    g.strokeStyle=rgba(b>.55?c1:c2,.35+b*.65);g.lineWidth=Math.max(2,R*.035);
    g.beginPath();g.moveTo(Math.cos(ba)*q0,Math.sin(ba)*q0);g.lineTo(Math.cos(ba)*q1,Math.sin(ba)*q1);g.stroke()}

  if(act)drawAct(t,R);

  else{pendingText=v;start()}};
function tab(which){var s=which==="set";$("#tabSet").setAttribute("aria-selected",String(s));$("#tabChat").setAttribute("aria-selected",String(!s));$("#paneSet").classList.toggle("on",s);$("#paneChat").classList.toggle("on",!s)}
$("#tabChat").onclick=function(){tab("chat")};$("#tabSet").onclick=function(){tab("set")};
function openCard(which){if(which)tab(which);$("#keyIn").value=get(K.key);$("#nameIn").value=get(K.name);$("#voiceIn").value=get(K.voice)||"Kore";$("#card").classList.add("open");$("#gripText").textContent="اسحب للأسفل"}
function closeCard(){$("#card").classList.remove("open");$("#gripText").textContent="اسحب للأعلى";if(document.activeElement&&document.activeElement.blur)document.activeElement.blur()}
$("#saveBtn").onclick=function(){set(K.key,$("#keyIn").value.trim());set(K.name,$("#nameIn").value.trim());set(K.voice,$("#voiceIn").value);if(live)stop();closeCard();if(get(K.key))start()};
$("#clearBtn").onclick=function(){log=[];set(K.log,"[]");renderLog()};
/* drag the card by its grip */
(function(){var card=$("#card"),grip=$("#grip"),y0=0,base=0,dy=0,drag=false,moved=false;
  grip.addEventListener("pointerdown",function(e){drag=true;moved=false;y0=e.clientY;dy=0;base=card.classList.contains("open")?0:card.getBoundingClientRect().height-44;card.classList.add("drag");try{grip.setPointerCapture(e.pointerId)}catch(x){}});
  grip.addEventListener("pointermove",function(e){if(!drag)return;dy=e.clientY-y0;if(Math.abs(dy)>6)moved=true;var y=Math.max(0,base+dy);card.style.transform="translateY("+y+"px)"});
  function up(){if(!drag)return;drag=false;card.classList.remove("drag");card.style.transform="";
    var open=card.classList.contains("open");
    if(!moved){open?closeCard():openCard()}else if(dy<-40){openCard()}else if(dy>40){closeCard()}}
  grip.addEventListener("keydown",function(e){if(e.key==="Enter"||e.key===" "){e.preventDefault();card.classList.contains("open")?closeCard():openCard()}});
  grip.addEventListener("pointerup",up);grip.addEventListener("pointercancel",up)})();
document.addEventListener("visibilitychange",function(){
  if(document.hidden){if(live)stop()}
  else if(get(K.key)&&!live&&!userEnded&&!$("#card").classList.contains("open"))start()});

renderLog();setMode("idle");
if(!get(K.key)){$("#state").textContent="أدخل مفتاح التفعيل للبدء";openCard("set")}
else start();
})();
</script>
</body>
</html>
