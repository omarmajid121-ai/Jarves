name: Android app

on:
  push:
    branches: [main]
    paths:
      - "android-app/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Sync web shell and plugins
        run: npx cap sync android

      - name: Signing key
        env:
          PASS: ${{ secrets.JARVES_KEY }}
        run: |
          ENC=signing/musaed.jks.enc
          if [ -z "$PASS" ]; then
            echo "SIGNED=temporary" >> "$GITHUB_ENV"
            echo "::warning::JARVES_KEY is not set; this build cannot update an installed copy."
            exit 0
          fi
          mkdir -p signing
          if [ -f "$ENC" ]; then
            openssl enc -d -aes-256-cbc -pbkdf2 -iter 300000 -in "$ENC" -out "$RUNNER_TEMP/musaed.jks" -pass env:PASS
          else
            keytool -genkeypair -keystore "$RUNNER_TEMP/musaed.jks" -storetype PKCS12 -alias musaed -keyalg RSA -keysize 4096 \
              -validity 36500 -storepass "$PASS" -keypass "$PASS" -dname "CN=Musaed, O=Musaed, C=SA"
            openssl enc -aes-256-cbc -pbkdf2 -iter 300000 -salt -in "$RUNNER_TEMP/musaed.jks" -out "$ENC" -pass env:PASS
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add "$ENC"
            git commit -m "Android: encrypted signing key [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
          echo "MUSAED_KEYSTORE=$RUNNER_TEMP/musaed.jks" >> "$GITHUB_ENV"
          echo "SIGNED=fixed" >> "$GITHUB_ENV"

      - name: Build
        env:
          MUSAED_BUILD: ${{ github.run_number }}
          MUSAED_KS_PASS: ${{ secrets.JARVES_KEY }}
        working-directory: android-app/android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease bundleRelease
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/musaed.apk"
          cp app/build/outputs/bundle/release/app-release.aab "$RUNNER_TEMP/musaed.aab"

      - uses: actions/upload-artifact@v4
        with:
          name: musaed-apk
          path: |
            ${{ runner.temp }}/musaed.apk
            ${{ runner.temp }}/musaed.aab

      - name: Publish download
        if: env.SIGNED == 'fixed'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view android-latest >/dev/null 2>&1 || gh release create android-latest --title "مساعد · تطبيق أندرويد" --notes "أحدث نسخة من تطبيق مساعد لأندرويد." --latest=false
          gh release upload android-latest "$RUNNER_TEMP/musaed.apk" "$RUNNER_TEMP/musaed.aab" --clobber
          gh release edit android-latest --notes "أحدث نسخة من تطبيق مساعد لأندرويد · بناء ${{ github.run_number }}"
